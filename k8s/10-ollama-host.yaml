# Selector-less Service + Endpoints => stable in-cluster DNS name "ollama-host"
# that points at Ollama on the Ubuntu host (kind docker bridge gateway IP).
apiVersion: v1
kind: Service
metadata:
  name: ollama-host
  namespace: ai-platform
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-host
  namespace: ai-platform
subsets:
  - addresses:
      - ip: ${OLLAMA_IP}
    ports:
      - name: http
        port: 11434
