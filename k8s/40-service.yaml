apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: ai-platform
  labels:
    app: ai-api
spec:
  type: NodePort
  selector:
    app: ai-api
  ports:
    - name: http          # ServiceMonitor refers to this port name
      port: 8000
      targetPort: http
      nodePort: ${API_NODEPORT}
